<script>

(function () {

  "use strict";


  /* =======================================================
     ROOT
     ======================================================= */

  var root = document.getElementById(
    "gd-west-africa-map-v4"
  );


  if (!root) {

    return;

  }


  /*
   * Prevent duplicate initialization if WordPress,
   * a page builder or a caching system executes
   * the script more than once.
   */

  if (root.dataset.gdInitialized === "true") {

    return;

  }


  root.dataset.gdInitialized = "true";


  /* =======================================================
     ELEMENTS
     ======================================================= */

  var svg =
    root.querySelector(".gdwa-svg");


  var tooltip =
    root.querySelector(".gdwa-tooltip");


  var loading =
    root.querySelector(".gdwa-loading");


  var replay =
    root.querySelector(".gdwa-replay");


  if (
    !svg ||
    !tooltip ||
    !loading ||
    !replay
  ) {

    console.error(
      "GlobalDev map: Required HTML elements are missing."
    );

    return;

  }


  /* =======================================================
     LOAD OUTFIT
     ======================================================= */

  function loadFont() {

    if (
      document.querySelector(
        'link[data-gd-west-africa-font]'
      )
    ) {

      return;

    }


    var font =
      document.createElement("link");


    font.rel = "stylesheet";


    font.href =
      "https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap";


    font.dataset.gdWestAfricaFont = "true";


    document.head.appendChild(font);

  }


  loadFont();


  /* =======================================================
     DATA URLS
     ======================================================= */

  var DATA_URLS = [

    "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson",

    "https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_admin_0_countries.geojson"

  ];


  /* =======================================================
     D3 URLS
     ======================================================= */

  var D3_URLS = [

    "https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js",

    "https://unpkg.com/d3@7.9.0/dist/d3.min.js"

  ];


  /* =======================================================
     STUDY COUNTRIES
     ======================================================= */

  var studyISO = new Set([

    "MRT",
    "SEN",
    "GMB",
    "GNB",
    "GIN",
    "SLE",
    "LBR",
    "CIV",
    "GHA",
    "TGO",
    "BEN",
    "NGA",

    /*
     * Island study countries.
     *
     * These are now represented ONLY by their
     * Natural Earth GeoJSON polygons.
     */

    "CPV",
    "STP"

  ]);


  /* =======================================================
     VISIBLE COUNTRIES
     ======================================================= */

  var visibleISO = new Set([

    "ESH",

    "MRT",
    "SEN",
    "GMB",
    "GNB",
    "GIN",
    "SLE",
    "LBR",
    "CIV",
    "GHA",
    "TGO",
    "BEN",
    "NGA",

    "MLI",
    "BFA",
    "NER",
    "DZA",
    "CMR",

    /*
     * Island study countries.
     *
     * Their actual GeoJSON geometries are used.
     */

    "CPV",
    "STP"

  ]);


  /* =======================================================
     DISPLAY NAMES
     ======================================================= */

  var names = {

    "MRT": "Mauritania",
    "SEN": "Senegal",
    "GMB": "The Gambia",
    "GNB": "Guinea-Bissau",
    "GIN": "Guinea",
    "SLE": "Sierra Leone",
    "LBR": "Liberia",
    "CIV": "Côte d’Ivoire",
    "GHA": "Ghana",
    "TGO": "Togo",
    "BEN": "Benin",
    "NGA": "Nigeria",

    "MLI": "Mali",
    "BFA": "Burkina Faso",
    "NER": "Niger",
    "DZA": "Algeria",
    "CMR": "Cameroon",

    "ESH": "Morocco",

    "CPV": "Cape Verde",
    "STP": "São Tomé and Príncipe"

  };


  /* =======================================================
     LABEL POSITIONS
     ======================================================= */

  var labelPositions = {

    "ESH": [-12.0, 24.0],

    "MRT": [-10.7, 20.0],

    "SEN": [-14.5, 14.5],

    "GMB": [-15.5, 13.45],

    "GNB": [-15.0, 12.0],

    "GIN": [-10.8, 10.8],

    "SLE": [-12.1, 8.7],

    "LBR": [-9.7, 6.6],

    "CIV": [-5.5, 7.8],

    "GHA": [-1.2, 7.9],

    "TGO": [1.1, 8.4],

    "BEN": [2.4, 10.0],

    "NGA": [8.2, 9.2],

    "BFA": [-1.7, 12.3],

    "MLI": [-3.5, 17.0],

    "NER": [8.0, 17.0],

    "DZA": [2.5, 25.0],

    "CMR": [12.0, 6.8],

    /*
     * Cape Verde.
     *
     * Only ONE label is created.
     */

    "CPV": [-24.0, 15.7],

    /*
     * São Tomé and Príncipe.
     *
     * Only ONE label is created.
     */

    "STP": [6.65, 0.7]

  };


  /* =======================================================
     SAFE TIMEOUT
     ======================================================= */

  function timeoutPromise(
    promise,
    milliseconds,
    message
  ) {

    return new Promise(function (
      resolve,
      reject
    ) {

      var finished = false;


      var timer =
        setTimeout(function () {

          if (finished) {

            return;

          }


          finished = true;


          reject(
            new Error(message)
          );

        }, milliseconds);


      promise.then(

        function (value) {

          if (finished) {

            return;

          }


          finished = true;


          clearTimeout(timer);


          resolve(value);

        },


        function (error) {

          if (finished) {

            return;

          }


          finished = true;


          clearTimeout(timer);


          reject(error);

        }

      );

    });

  }


  /* =======================================================
     LOAD D3
     ======================================================= */

  function loadD3() {

    /*
     * D3 already available.
     */

    if (
      window.d3 &&
      typeof window.d3.geoMercator === "function"
    ) {

      return Promise.resolve(
        window.d3
      );

    }


    return new Promise(function (
      resolve,
      reject
    ) {

      var existing =
        document.querySelector(
          'script[data-gd-d3], script[src*="d3.min.js"]'
        );


      if (existing) {

        var elapsed = 0;


        var check =
          setInterval(function () {

            if (
              window.d3 &&
              typeof window.d3.geoMercator === "function"
            ) {

              clearInterval(check);

              resolve(window.d3);

              return;

            }


            elapsed += 100;


            if (elapsed >= 10000) {

              clearInterval(check);

              reject(
                new Error(
                  "D3.js was found but did not become available."
                )
              );

            }

          }, 100);


        return;

      }


      function tryD3(index) {

        if (index >= D3_URLS.length) {

          reject(
            new Error(
              "Unable to load D3.js."
            )
          );

          return;

        }


        var script =
          document.createElement("script");


        script.src =
          D3_URLS[index];


        script.async = true;


        script.dataset.gdD3 =
          "true";


        var settled = false;


        var timer =
          setTimeout(function () {

            if (settled) {

              return;

            }


            settled = true;


            script.remove();


            tryD3(index + 1);

          }, 10000);


        script.onload =
          function () {

            if (settled) {

              return;

            }


            settled = true;


            clearTimeout(timer);


            if (
              window.d3 &&
              typeof window.d3.geoMercator === "function"
            ) {

              resolve(window.d3);

            } else {

              script.remove();

              tryD3(index + 1);

            }

          };


        script.onerror =
          function () {

            if (settled) {

              return;

            }


            settled = true;


            clearTimeout(timer);


            script.remove();


            tryD3(index + 1);

          };


        document.head.appendChild(script);

      }


      tryD3(0);

    });

  }


  /* =======================================================
     LOAD GEOJSON
     ======================================================= */

  function loadData() {

    function tryURL(index) {

      if (
        index >= DATA_URLS.length
      ) {

        return Promise.reject(
          new Error(
            "Unable to load the map data."
          )
        );

      }


      var controller =
        typeof AbortController !== "undefined"
          ? new AbortController()
          : null;


      var request =
        fetch(
          DATA_URLS[index],
          {
            mode: "cors",
            credentials: "omit",

            signal:
              controller
                ? controller.signal
                : undefined
          }
        );


      var timed =
        timeoutPromise(
          request,
          15000,
          "Map data request timed out."
        );


      return timed

        .then(function (response) {

          if (!response.ok) {

            throw new Error(
              "Map data returned HTTP " +
              response.status
            );

          }


          return response.json();

        })


        .catch(function () {

          if (controller) {

            try {

              controller.abort();

            } catch (e) {}

          }


          return tryURL(index + 1);

        });

    }


    return tryURL(0);

  }


  /* =======================================================
     START MAP
     ======================================================= */

  function startMap() {

    /*
     * Clear old error state.
     */

    loading.classList.remove("error");


    loading.innerHTML =
      "Loading map…";


    loading.onclick = null;


    loadD3()

      .then(function () {

        return loadData();

      })

      .then(function (world) {

        drawMap(world);

      })

      .catch(function (error) {

        console.error(
          "GlobalDev West Africa map:",
          error
        );


        loading.classList.add(
          "error"
        );


        loading.innerHTML =
          "Map could not be loaded.<br>" +
          "<span style='font-size:11px;font-weight:400'>" +
          "Please refresh the page." +
          "</span>";


        loading.onclick =
          function () {

            loading.classList.remove(
              "error"
            );


            loading.innerHTML =
              "Loading map…";


            startMap();

          };

      });

  }


  /* =======================================================
     DRAW MAP
     ======================================================= */

  function drawMap(world) {

    var d3 =
      window.d3;


    if (
      !world ||
      !world.features ||
      !Array.isArray(world.features)
    ) {

      throw new Error(
        "Invalid GeoJSON data."
      );

    }


    /* -------------------------------------------------------
       FILTER COUNTRIES
       ------------------------------------------------------- */

    var features =
      world.features.filter(
        function (feature) {

          var iso =
            getISO(feature);


          return visibleISO.has(iso);

        }
      );


    if (!features.length) {

      throw new Error(
        "No West African countries were found in the dataset."
      );

    }


    /* -------------------------------------------------------
       DEBUG CHECK
       ------------------------------------------------------- */

    var capeVerdeCount =
      features.filter(
        function (f) {

          return getISO(f) === "CPV";

        }
      ).length;


    var saoTomeCount =
      features.filter(
        function (f) {

          return getISO(f) === "STP";

        }
      ).length;


    console.log(
      "GlobalDev map — Cape Verde GeoJSON features:",
      capeVerdeCount
    );


    console.log(
      "GlobalDev map — São Tomé and Príncipe GeoJSON features:",
      saoTomeCount
    );


    /* -------------------------------------------------------
       COLLECTION
       ------------------------------------------------------- */

    var collection = {

      type: "FeatureCollection",

      features: features

    };


    /* -------------------------------------------------------
       PROJECTION
       ------------------------------------------------------- */

    var projection =
      d3.geoMercator()
        .fitExtent(
          [
            [48, 35],
            [952, 610]
          ],
          collection
        );


    /* -------------------------------------------------------
       PATH
       ------------------------------------------------------- */

    var path =
      d3.geoPath()
        .projection(projection);


    /* -------------------------------------------------------
       CLEAR PREVIOUS MAP
       ------------------------------------------------------- */

    while (
      svg.childNodes.length > 1
    ) {

      svg.removeChild(
        svg.lastChild
      );

    }


    /* -------------------------------------------------------
       MAIN GROUP
       ------------------------------------------------------- */

    var mapGroup =
      d3.select(svg)
        .append("g")
        .attr(
          "class",
          "gdwa-map-group"
        );


    /* =======================================================
       COUNTRIES
       ======================================================= */

    var countryPaths =
      mapGroup
        .selectAll(".gdwa-country")
        .data(features)
        .enter()
        .append("path")
        .attr(
          "class",
          function (d) {

            var iso =
              getISO(d);


            return (
              "gdwa-country" +
              (
                studyISO.has(iso)
                  ? " study"
                  : ""
              )
            );

          }
        )
        .attr(
          "d",
          path
        )
        .attr(
          "data-iso",
          getISO
        )
        .attr(
          "tabindex",
          function (d) {

            return studyISO.has(
              getISO(d)
            )
              ? "0"
              : "-1";

          }
        )
        .attr(
          "role",
          "button"
        )
        .attr(
          "aria-label",
          function (d) {

            return (
              names[getISO(d)] ||
              getName(d)
            );

          }
        );


    /* =======================================================
       COUNTRY LABELS
       ======================================================= */

    mapGroup
      .selectAll(".gdwa-label")
      .data(features)
      .enter()
      .append("text")
      .attr(
        "class",
        function (d) {

          var iso =
            getISO(d);


          if (
            iso === "GNB" ||
            iso === "SLE" ||
            iso === "ESH"
          ) {

            return (
              "gdwa-label gdwa-label-small"
            );

          }


          if (
            iso === "GMB"
          ) {

            return (
              "gdwa-label gdwa-label-tiny"
            );

          }


          /*
           * The island countries also use the
           * normal country-label system.
           *
           * There is NO second island label.
           */

          return "gdwa-label";

        }
      )
      .attr(
        "x",
        function (d) {

          var p =
            labelPositions[
              getISO(d)
            ];


          if (p) {

            return projection(p)[0];

          }


          return path.centroid(d)[0];

        }
      )
      .attr(
        "y",
        function (d) {

          var p =
            labelPositions[
              getISO(d)
            ];


          if (p) {

            return projection(p)[1];

          }


          return path.centroid(d)[1];

        }
      )
      .text(
        function (d) {

          return (
            names[getISO(d)] ||
            getName(d)
          );

        }
      );


    /* =======================================================
       GULF OF GUINEA
       ======================================================= */

    var gulf =
      projection([
        2.5,
        2.3
      ]);


    mapGroup
      .append("text")
      .attr(
        "class",
        "gdwa-gulf"
      )
      .attr(
        "x",
        gulf[0]
      )
      .attr(
        "y",
        gulf[1]
      )
      .text(
        "GULF OF GUINEA"
      );


    /* =======================================================
       COUNTRY INTERACTION
       ======================================================= */

    countryPaths

      .on(
        "mouseenter",
        function (event, d) {

          showCountry(
            d,
            event
          );

        }
      )

      .on(
        "mousemove",
        function (event) {

          moveTooltip(event);

        }
      )

      .on(
        "mouseleave",
        hideTooltip
      )

      .on(
        "click",
        function (event, d) {

          event.stopPropagation();

          selectCountry(d);

        }
      )

      .on(
        "keydown",
        function (event, d) {

          if (
            event.key === "Enter" ||
            event.key === " "
          ) {

            event.preventDefault();

            selectCountry(d);

          }

        }
      );


    /* =======================================================
       RESET BUTTON
       ======================================================= */

    replay.onclick =
      function () {

        countryPaths

          .classed(
            "selected",
            false
          )

          .classed(
            "dimmed",
            false
          );


        hideTooltip();

      };


    /* =======================================================
       RESET WHEN MAP BACKGROUND IS CLICKED
       ======================================================= */

    svg.addEventListener(
      "click",
      function () {

        countryPaths

          .classed(
            "selected",
            false
          )

          .classed(
            "dimmed",
            false
          );


        hideTooltip();

      }
    );


    /* =======================================================
       MAP SUCCESSFULLY LOADED
       ======================================================= */

    loading.classList.add(
      "hidden"
    );


    console.log(
      "GlobalDev West Africa map loaded successfully."
    );


    /* =======================================================
       FUNCTIONS
       ======================================================= */


    function getISO(feature) {

      var p =
        feature.properties || {};


      var candidates = [

        p.ISO_A3,
        p.ADM0_A3,
        p.SOV_A3,
        p.ISO_A3_EH

      ];


      for (
        var i = 0;
        i < candidates.length;
        i++
      ) {

        if (
          candidates[i] &&
          candidates[i] !== "-99"
        ) {

          return String(
            candidates[i]
          ).toUpperCase();

        }

      }


      return "";

    }


    function getName(feature) {

      var p =
        feature.properties || {};


      return (

        p.ADMIN ||
        p.NAME ||
        p.GEOUNIT ||
        p.NAME_LONG ||
        ""

      );

    }


    function showCountry(
      d,
      event
    ) {

      var iso =
        getISO(d);


      var name =
        names[iso] ||
        getName(d);


      var study =
        studyISO.has(iso);


      showSimpleTooltip(

        name,

        study
          ? "Study country"
          : "Other country",

        event

      );

    }


    function showSimpleTooltip(
      name,
      status,
      event
    ) {

      tooltip.innerHTML =

        "<strong>" +
        escapeHTML(name) +
        "</strong>" +

        "<div class='gdwa-tooltip-status'>" +
        escapeHTML(status) +
        "</div>";


      tooltip.classList.add(
        "visible"
      );


      moveTooltip(event);

    }


    function moveTooltip(event) {

      var container =
        root.querySelector(
          ".gdwa-map-container"
        );


      if (!container) {

        return;

      }


      var rect =
        container.getBoundingClientRect();


      var x =
        event.clientX -
        rect.left +
        12;


      var y =
        event.clientY -
        rect.top +
        12;


      var w =
        tooltip.offsetWidth ||
        150;


      var h =
        tooltip.offsetHeight ||
        50;


      if (
        x + w >
        rect.width - 8
      ) {

        x =
          event.clientX -
          rect.left -
          w -
          12;

      }


      if (
        y + h >
        rect.height - 8
      ) {

        y =
          event.clientY -
          rect.top -
          h -
          12;

      }


      tooltip.style.left =
        Math.max(
          6,
          x
        ) + "px";


      tooltip.style.top =
        Math.max(
          6,
          y
        ) + "px";

    }


    function hideTooltip() {

      tooltip.classList.remove(
        "visible"
      );

    }


    function selectCountry(d) {

      var iso =
        getISO(d);


      var name =
        names[iso] ||
        getName(d);


      countryPaths

        .classed(
          "selected",
          function (country) {

            return country === d;

          }
        )

        .classed(
          "dimmed",
          function (country) {

            return country !== d;

          }
        );


      var container =
        root.querySelector(
          ".gdwa-map-container"
        );


      if (!container) {

        return;

      }


      var rect =
        container.getBoundingClientRect();


      showSimpleTooltip(

        name,

        studyISO.has(iso)
          ? "Study country"
          : "Other country",

        {

          clientX:
            rect.left + 20,

          clientY:
            rect.top + 20

        }

      );

    }


    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  }


  /* =======================================================
     START
     ======================================================= */

  startMap();


})();

</script>
